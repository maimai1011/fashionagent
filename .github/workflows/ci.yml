name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run backend unit tests
        run: uv run --locked --no-sync pytest -q tests/unit
      - name: Lint Python code
        run: uv run --locked --no-sync ruff check agent api storage inference ui/streamlit_app.py ui/config.py ui/tests tests

  streamlit:
    name: Streamlit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
      - name: Install locked UI dependencies
        run: uv sync --locked --project ui
      - name: Run Streamlit tests
        run: uv run --locked --no-sync --project ui python -m unittest discover -s ui/tests -p 'test_*.py'
