[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-agents"
version = "0.1.0"
description = "LLM agents and product search for the fashion assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "opentelemetry-api>=1.30,<2",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
catalog = [
    "pymilvus>=2.5,<3",
    "sentence-transformers>=3,<6",
]
postgres = ["langgraph-checkpoint-postgres>=2,<4"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = { agent = "." }
packages = [
    "agent",
    "agent.agents",
    "agent.agents.intent",
    "agent.agents.stylist",
    "agent.agents.chat",
    "agent.persistence",
    "agent.search",
    "agent.observability",
]

[tool.setuptools.package-data]
"agent.agents" = ["skills/**/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests/unit", "../tests/integration"]
markers = ["integration: requires live external services"]
pythonpath = [".."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
