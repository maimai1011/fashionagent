[project]
name = "fashion-agent"
version = "0.1.0"
requires-python = ">=3.11, <3.12"
dependencies = [
    "boto3>=1.43.114",
    "celery>=5.6.3",
    "email-validator>=2.3.0",
    "fastapi>=0.143.3",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
    "opentelemetry-instrumentation-celery>=0.51b0,<1",
    "pika>=1.4.4",
    "pillow>=13.0.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
    "pymilvus>=3.0.2",
    "torch>=2.5,<3",
    "transformers>=4.45,<5",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
pythonpath = ["."]
markers = ["integration: requires live external services"]
